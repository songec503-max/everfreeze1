<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVERFREEZE</title>
<style>
:root{
  --ink:#2b2a35; --ink2:#5a586b; --paper:#fffdf8; --line:#d9d4c7;
  --npc:#5b8fc9; --inspect:#d99a2b; --puzzle:#8a63c9; --move:#4aa070;
  --accent:#6b5bd6; --bad:#c9503c;
  --font:'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--font);color:var(--ink)}
#stagewrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:6px;background:#000}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:top left;overflow:hidden;background:#000;user-select:none}
button{font-family:inherit;cursor:pointer}

/* 배경 */
.scene{position:absolute;inset:0;transition:filter .6s}
.wm{position:absolute;left:0;right:0;top:46%;text-align:center;font-size:84px;font-weight:800;color:rgba(255,255,255,.34);letter-spacing:.04em;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.04)}
.wm::after{content:'배경 이미지 자리';display:block;font-size:15px;font-weight:600;letter-spacing:.2em;color:rgba(0,0,0,.22);margin-top:6px}
.fx{position:absolute;inset:0;pointer-events:none;transition:opacity .8s}

/* 오류 단계 연출 (단계 누적 · 전역) */
#stage[data-stage="2"] .scene{filter:saturate(.92)}
#stage[data-stage="2"] .fx{background:radial-gradient(ellipse at center,transparent 60%,rgba(60,40,90,.14) 100%)}
#stage[data-stage="3"] .scene{filter:saturate(.78) hue-rotate(-8deg)}
#stage[data-stage="3"] .fx{background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 2px,transparent 2px 5px),radial-gradient(ellipse at center,transparent 50%,rgba(60,30,90,.22) 100%)}
#stage[data-stage="4"] .scene{filter:saturate(.6) hue-rotate(-18deg) contrast(1.05);animation:jitter 5s steps(1) infinite}
#stage[data-stage="4"] .fx{background:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 2px,transparent 2px 4px),linear-gradient(90deg,rgba(255,0,80,.05),transparent 30%,transparent 70%,rgba(0,200,255,.06)),radial-gradient(ellipse at center,transparent 40%,rgba(40,10,70,.34) 100%)}
#stage[data-stage="5"] .scene{filter:grayscale(.78) brightness(.94)}
#stage[data-stage="5"] .fx{background:radial-gradient(ellipse at center,transparent 55%,rgba(20,20,30,.3) 100%)}
@keyframes jitter{0%,92%,100%{transform:none}93%{transform:translateX(5px)}95%{transform:translateX(-6px) skewX(.6deg)}97%{transform:translateX(3px)}}
#stage[data-stage="5"] *{animation-play-state:paused}

/* 핫스팟 */
.hotspots{position:absolute;inset:0}
.hs{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px solid rgba(255,255,255,.55);border-radius:18px;background:rgba(255,255,255,.34);color:var(--ink);backdrop-filter:blur(1px);transition:transform .12s,background .12s,box-shadow .12s;padding:6px}
.hs .ico{font-size:54px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.hs .lbl{font-size:21px;font-weight:700;background:rgba(255,253,248,.92);border-radius:10px;padding:3px 10px;max-width:100%;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hs:hover{background:rgba(255,255,255,.62);transform:translateY(-3px) scale(1.02);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.hs:active{transform:scale(.98)}
.hs-npc{border-radius:50% 50% 18px 18px / 40% 40% 18px 18px}
#stage.hints .hs{border-style:solid;border-width:3px}
#stage.hints .hs-npc{border-color:var(--npc)} #stage.hints .hs-inspect{border-color:var(--inspect)}
#stage.hints .hs-puzzle{border-color:var(--puzzle)} #stage.hints .hs-move{border-color:var(--move)}
#stage.hints .hs.temp{border-style:dashed}
#stage.hints .hs.temp::after{content:'임시';position:absolute;top:4px;right:6px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);border-radius:6px;padding:1px 6px}


/* 장소 소개말 / 토스트 / 배너 */
.toasts{position:absolute;right:18px;top:70px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;z-index:30}
.toast{background:rgba(35,32,52,.92);color:#fff;padding:9px 16px;border-radius:12px;font-size:15px;animation:toastIn .25s ease}
.toast.gain{background:#4a3fb5}
.toast.out{opacity:0;transition:opacity .5s}
@keyframes toastIn{from{opacity:0;transform:translateX(16px)}}
.banner{position:absolute;left:50%;top:120px;transform:translateX(-50%);text-align:center;color:#fff;background:rgba(40,16,60,.84);padding:12px 30px;border-radius:16px;opacity:0;pointer-events:none;z-index:25}
.banner b{display:block;font-size:20px;margin-bottom:4px}
.banner span{font-size:16px;opacity:.9}
.banner.show{animation:bannerAnim 3.6s ease forwards}
@keyframes bannerAnim{0%{opacity:0}12%,78%{opacity:1}100%{opacity:0}}

/* 오버레이 공통 */
.scrim{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-bottom:34px}
.scrim.dim{background:rgba(20,18,30,.55);align-items:center;padding:0}
.textbox{width:960px;min-height:150px;background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:22px 28px;box-shadow:0 10px 30px rgba(0,0,0,.35);position:relative;animation:rise .18s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.textbox .who{font-weight:800;margin-bottom:6px}
.textbox .body{font-size:22px;line-height:1.55}
.textbox .note{margin-top:10px;font-size:14px;color:var(--move);font-weight:700}
.textbox .next{position:absolute;right:22px;bottom:12px;font-size:13px;color:var(--ink2)}
.textbox.dialogue{display:flex;gap:22px;align-items:flex-start}
.portrait{flex:none;width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#fff;border:3px solid var(--ink)}
.dcol{flex:1}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dhead b{font-size:20px}.dhead .role{font-size:14px;color:var(--ink2)}
.dhead .ctx{font-size:12px;background:#ece8ff;color:var(--accent);border-radius:8px;padding:2px 8px;font-weight:700}
.textbox.dialogue .close{align-self:flex-end}

/* 퍼즐 */
.puzzle{width:100%;max-width:820px;margin:14px 0;background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:26px 30px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.puzzle h3{margin:0 0 8px;font-size:22px}
.puzzle .prompt{margin:0 0 18px;font-size:18px;line-height:1.5}
.parea{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;font-size:17px;text-align:left}
.opt:hover:not(:disabled){border-color:var(--puzzle)}
.opt.on{border-color:var(--puzzle);background:#f1eaff}
.opt:disabled{opacity:.35;cursor:default}
.seq{display:flex;gap:8px;flex-wrap:wrap}
.slot{flex:1;min-width:130px;border:2px dashed var(--line);border-radius:12px;padding:10px;text-align:center;font-size:15px;color:var(--ink2);min-height:48px;display:flex;align-items:center;justify-content:center}
.slot.filled{border-style:solid;border-color:var(--puzzle);background:#f1eaff;color:var(--ink);font-weight:600}
.pool{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.code{font-size:30px;text-align:center;letter-spacing:.3em;border:2px solid var(--line);border-radius:12px;padding:10px;width:200px;margin:0 auto;font-family:var(--font)}
.pmsg{min-height:24px;margin:14px 0 4px;color:var(--bad);font-weight:600}
.pactions{display:flex;justify-content:flex-end;gap:10px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* 엔딩 */
.ending{width:100%;max-width:700px;margin:14px 0;background:#f4f1ea;border:2px solid var(--ink);border-radius:20px;padding:34px 40px;text-align:center;line-height:1.7;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.ending h2{margin:0 0 16px;font-size:26px}.ending p{margin:0;font-size:18px}.ending .btn{margin-top:22px}

/* 추리 수첩 */
.notebook{width:100%;background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:20px 26px;display:flex;flex-direction:column;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.nb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.nb-head h2{margin:0;font-size:24px}
.nb-cols{display:grid;grid-template-columns:380px 1fr;gap:26px}
.nb-left,.nb-right{padding-right:6px}
.nb-left h4,.nb-right h4{margin:12px 0 6px;font-size:15px;color:var(--ink2)}
.evlist{display:flex;flex-wrap:wrap;gap:6px}
.ev{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:14px}
.ev:hover{border-color:var(--accent)}.ev.picked{background:#e9e4ff;border-color:var(--accent)}
.empty{color:var(--ink2);font-size:14px}
.evdetail{margin-top:14px;padding:12px 14px;background:#f4f1ea;border-radius:12px;font-size:15px;line-height:1.5}
.evdetail .place{margin-left:8px;font-size:12px;color:var(--ink2)}.evdetail p{margin:6px 0 0}
.dcard{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:10px}
.dcard.active{border:2px solid var(--accent)}
.dcard.solved{background:#f0f8f2;border-color:#9bcfae}
.dtop{display:flex;justify-content:space-between;align-items:center}
.dtop .tag{font-size:12px;border-radius:8px;padding:2px 8px;background:#eee;color:var(--ink2)}
.dcard.solved .tag{background:var(--move);color:#fff}
.dcard p{margin:6px 0}.dcard .sub{color:var(--ink2);font-size:14px}.dcard .hypo{font-size:15px}
.dcard .msg{color:var(--bad);font-weight:600;font-size:14px}
.slots{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.slots .slot{min-width:150px;flex:none;cursor:pointer}
.row{display:flex;gap:8px}

/* DEV */
.devpanel{position:absolute;right:12px;top:12px;width:360px;max-height:600px;overflow:auto;z-index:40;background:rgba(20,18,30,.94);color:#fff;border-radius:12px;padding:12px;font-size:12px;display:flex;flex-direction:column;gap:8px}
.devpanel select{width:100%;padding:4px}
.devev{display:flex;flex-wrap:wrap;gap:4px}
.devev button{background:#333;color:#ddd;border:1px solid #555;border-radius:6px;padding:2px 6px;font-size:11px}
.devev button.on{background:#6b5bd6;color:#fff}
.devpanel .row button{background:#444;color:#fff;border:0;border-radius:6px;padding:4px 10px}
.devflags{color:#bbb;line-height:1.5;word-break:break-all}

/* ===== 사이트 틀 (옛날 홈페이지 느낌) ===== */
body{background:#efe9dc;background-image:radial-gradient(rgba(120,100,70,.10) 1px,transparent 1px);background-size:14px 14px}
#site{max-width:1280px;margin:0 auto;padding:18px 16px 28px}
#masthead{background:#fffdf8;border:3px double #8a7b62;border-radius:8px;padding:16px 22px;text-align:center;box-shadow:3px 3px 0 rgba(90,75,50,.25)}
.logo{font-size:40px;font-weight:800;letter-spacing:.18em;color:#4b3f63}
.tagline{margin-top:6px;font-size:15px;color:var(--ink2)}
#nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;padding:8px 10px;background:#e4dcc9;border:2px solid #8a7b62;border-radius:8px}
.navitem{padding:6px 14px;border:2px dotted #8a7b62;border-radius:8px;background:#fffdf8;color:var(--ink);text-decoration:none;font-weight:700;font-size:15px}
.navitem:hover,.navitem.on{background:#e9e4ff;border-color:var(--accent);border-style:solid}
.nav-memo{margin-left:auto}
#page{background:#fffdf8;border:3px double #8a7b62;border-radius:8px;padding:14px 16px 18px;box-shadow:3px 3px 0 rgba(90,75,50,.25)}
#crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px;font-size:14px;min-height:22px}
#crumbs a{color:#3b5bb5}
#crumbs .back{font-weight:700}
#crumbs .sep{color:#aaa}
#crumbs .crumb.now{font-weight:700}
#caption{margin-top:14px;padding:6px 4px 0}
#caption h2{margin:0 0 6px;font-size:24px;color:#4b3f63}
#pintro{margin:0 0 8px;font-size:17px;line-height:1.6}
.tip{margin:0;font-size:13px;color:var(--ink2)}
.tip a{color:#3b5bb5}
#foot{margin-top:14px;text-align:center;font-size:13px;color:var(--ink2)}
#foot .sep{margin:0 10px;color:#bbb}
.devlink{margin-left:12px;color:#aaa;font-size:11px}
/* 단계가 오르면 사이트 틀도 조금씩 어긋난다 */
body[data-stage="3"] #masthead .logo{letter-spacing:.14em}
body[data-stage="4"] #masthead{border-style:dashed}
body[data-stage="4"] .tagline{opacity:.75}
body[data-stage="5"]{filter:grayscale(.55)}
body[data-stage="5"] .tagline{letter-spacing:.3em}
.banner{top:70px}

/* ===== 페이지 이동형 레이아웃 ===== */
#caption{margin:0 0 12px}
#cols{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;align-items:start}
#side{background:#f4efe3;border:2px solid #cbbfa3;border-radius:10px;padding:12px 14px}
#side h3{margin:0 0 8px;font-size:16px;color:#4b3f63;border-bottom:1px dashed #b9ad92;padding-bottom:6px}
.sgroup{margin:10px 0}
.sg-title{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.lk{display:block;padding:4px 6px;font-size:16px;color:#3b5bb5;text-decoration:underline;border-radius:6px}
.lk:hover{background:#e9e4ff}
.lk-npc{color:#2f6fb0}.lk-inspect{color:#a86a10}.lk-puzzle{color:#6a47b0}.lk-move{color:#2e7d54}
.tip{margin:10px 0 0}
#panel{margin-top:6px}
#log{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.entry{border:1px solid var(--line);border-left:6px solid #b9ad92;background:#fff;border-radius:10px;padding:12px 16px;animation:rise .2s ease}
.entry.text .body,.entry.say .body{font-size:19px;line-height:1.6}
.entry .note{margin-top:6px;font-size:14px;color:var(--move);font-weight:700}
.entry.say{display:flex;gap:16px;align-items:flex-start;border-left-color:var(--npc)}
.entry.say .portrait{width:64px;height:64px;font-size:28px;flex:none}
.entry.line{padding:7px 14px;font-size:15px;background:#f7f4ec;border-left-color:#cbbfa3}
.entry.line.gain{background:#efeaff;border-left-color:var(--accent);color:#3a2f8a;font-weight:600}
.entry.stagenote{background:#2d2438;color:#e8dcf5;border-left-color:#c9503c;font-size:15px}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dhead b{font-size:18px}.dhead .role{font-size:13px;color:var(--ink2)}
.dhead .ctx{font-size:12px;background:#ece8ff;color:var(--accent);border-radius:8px;padding:2px 8px;font-weight:700}
#memo .notebook{background:#fffdf8;border:2px solid #cbbfa3;box-shadow:none;margin-top:4px}
@media (max-width:900px){#cols{grid-template-columns:1fr}.nb-cols{grid-template-columns:1fr}}

</style>
</head>
<body>
<div id="site">
  <header id="masthead">
    <div class="logo">EVERFREEZE</div>
    <div class="tagline" id="tagline"></div>
  </header>
  <nav id="nav"></nav>
  <main id="page">
    <div id="crumbs"></div>
    <section id="caption">
      <h2 id="ptitle"></h2>
      <p id="pintro"></p>
    </section>
    <div id="cols">
      <div id="stagewrap"><div id="stage"></div></div>
      <aside id="side"></aside>
    </div>
    <p class="tip" id="tip">그림 속이나 오른쪽 목록의 링크를 눌러 보세요. <a href="#" id="hintLink">클릭할 수 있는 곳 표시하기</a></p>
    <section id="panel"></section>
    <section id="log" aria-live="polite"></section>
    <section id="memo"></section>
  </main>
  <footer id="foot"><span id="counter"></span><span class="sep">|</span><span>Best viewed on PC · 1280px 이상 권장</span><span id="devSlot"></span></footer>
</div>
<!-- 데이터 -->
<script>

      3: { name: '비일상 중기', desc: '자료 보관실에 접근할 수 있다' },
      4: { name: '비일상 후반', desc: '필수 추리를 마치면 아리아와 마주할 수 있다' },
      5: { name: '완전한 오류', desc: '새로운 일은 더 이상 일어나지 않는다' }
    },
    ending: {
      title: '5단계 · 완전한 오류',
      body: '세계는 무너지지도, 어두워지지도 않았다.\n모든 것이 그대로인 채, 그저 더는 아무것도 새로 일어나지 않을 뿐이다.\n\n클로버는 여전히 이 마을들을 걸을 수 있다.\n(임시 문구 · 열린 결말)',

<script>
/* 장면 + 핫스팟 + 규칙.
   - 좌표는 1280x720 기준 px. (x,y,w,h)
   - 핫스팟 rules 는 위에서부터 검사해 "처음 통과한 규칙"의 do 를 실행한다.
   - temp:true 는 임시 요소(힌트 표시를 켜면 점선으로 보임).
   - 배경 이미지는 assets/bg/<장면ID>.png 를 넣으면 자동으로 덮어쓴다. */
(function () {
  const EF = window.EF;
  const TX = EF.TEXT;

  // ---------- 배경 헬퍼 ----------
  const room = (wall, floor, at = 66) =>
    `linear-gradient(180deg, ${wall} 0%, ${wall} ${at}%, ${floor} ${at}%, ${floor} 100%)`;
  const sky = (top, bottom, ground, at = 64) =>
    `linear-gradient(180deg, ${top} 0%, ${bottom} ${at}%, ${ground} ${at}%, ${ground} 100%)`;

  // ---------- 핫스팟 헬퍼 ----------
  const hs = (kind, id, label, icon, box, rules, o = {}) =>
    Object.assign({ kind, id, label, icon, x: box[0], y: box[1], w: box[2], h: box[3], rules, temp: false }, o);

  const lockRule = o => {
    if (o.min) return { if: [{ not: { stageMin: o.min } }], do: [{ text: o.early || TX.notYet }] };
    if (o.lock) return { if: [{ not: o.lock.cond }], do: [{ text: o.lock.text }] };
    return null;
  };

  // 조사: 첫 클릭에만 증거 등록, 재클릭은 기존 설명
  function inspect(id, label, icon, box, o) {
    const r = [], lk = lockRule(o);
    if (lk) r.push(lk);
    if (o.grant) {
      r.push({ if: [{ has: o.grant }], do: [{ text: o.repeat || o.text, note: TX.alreadyNoted }] });
      r.push({ if: [{ ended: true }], do: [{ text: TX.endedInspect }] });
      r.push({ do: [{ text: o.text }, { grant: o.grant }] });
    } else r.push({ do: [{ text: o.text }] });
    return hs('inspect', id, label, icon, box, r, { temp: o.temp !== false, showIf: o.showIf });
  }

  // 퍼즐
  function puzzle(id, label, icon, box, pid, o = {}) {
    const r = [], lk = lockRule(o);
    if (lk) r.push(lk);
    r.push({ if: [{ solved: pid }], do: [{ text: o.repeat || '이미 풀어낸 퍼즐이다.' }] });
    r.push({ if: [{ ended: true }], do: [{ text: TX.endedInspect }] });
    r.push({ do: [{ puzzle: pid }] });
    return hs('puzzle', id, label, icon, box, r, { temp: o.temp !== false, showIf: o.showIf });
  }

  const npc = (id, label, icon, box, npcId, o = {}) =>
    hs('npc', id, label, icon, box, o.rules || [{ do: [{ say: npcId }] }], { temp: !!o.temp });

  const move = (id, label, icon, box, to, o = {}) =>

  add({

      inspect('mirror', '거울', '🪞', [820, 160, 170, 300], {

<script>
/* 게임 상태. 메모리에만 보관(새로고침하면 초기화). 오류 단계는 저장하지 않고 계산한다. */
(function () {
  const EF = window.EF;
  // 단계 구간: 구간 내 흔적을 모두 찾으면 다음 단계로 (임시 배분 3·3·4·3)
  EF.TIERS = [
    ['R-01', 'R-02', 'R-03'],
    ['R-04', 'R-05', 'R-06'],
    ['R-07', 'R-08', 'R-09', 'R-10'],
    ['R-11', 'R-12', 'R-13']
  ];
  const create = () => ({ scene: 'WORLD_MAP', evidence: {}, solved: {}, flags: {}, deduced: {}, order: 0 });
  EF.state = create();
  EF.reset = () => { EF.state = create(); };
  EF.getStage = (s = EF.state) => 1 + EF.TIERS.filter(t => t.every(id => s.evidence[id])).length;
  EF.isEnded = () => EF.getStage() === 5;
  EF.traceCount = () => Object.keys(EF.state.evidence).filter(id => EF.EVIDENCE[id].type === 'trace').length;
})();

</script>
<script>
/* 조건 평가. 배열은 AND. 지원: stageMin stageMax has solved flag deduced ended notEnded not any all */
(function () {
  const EF = window.EF;
  EF.check = function check(cond, s = EF.state) {
    if (cond === undefined || cond === null) return true;
    if (Array.isArray(cond)) return cond.every(c => check(c, s));
    return Object.keys(cond).every(k => {
      const v = cond[k];
      switch (k) {
        case 'stageMin': return EF.getStage(s) >= v;
        case 'stageMax': return EF.getStage(s) <= v;
        case 'has': return !!s.evidence[v];
        case 'solved': return !!s.solved[v];
        case 'flag': return !!s.flags[v];
        case 'deduced': return !!s.deduced[v];
        case 'ended': return EF.getStage(s) === 5;
        case 'notEnded': return EF.getStage(s) !== 5;
        case 'not': return !check(v, s);
        case 'any': return v.some(c => check(c, s));
        case 'all': return v.every(c => check(c, s));
        default: console.warn('알 수 없는 조건', k); return false;
      }
    });
  };
})();

</script>
<script>
/* 규칙 엔진. 화면과 무관하게 state 를 바꾸고, 보여줄 것은 queue 로 돌려준다.
   action: go text say toast grant puzzle flag deduce
   5단계(엔딩) 이후에는 grant puzzle flag deduce 가 차단된다. */
(function () {
  const EF = window.EF;
  const BLOCKED = ['grant', 'puzzle', 'flag', 'deduce'];

  EF.exec = function (actions, q) {
    const s = EF.state;
    let blocked = false;
    for (const a of actions) {
      const key = Object.keys(a)[0];
      if (EF.isEnded() && BLOCKED.includes(key)) { blocked = true; continue; }
      switch (key) {
        case 'go': s.scene = a.go; break;
        case 'text': q.push({ t: 'text', text: a.text, note: a.note, who: a.who }); break;
        case 'say': q.push({ t: 'say', npc: a.say, ctx: a.ctx }); break;
        case 'toast': q.push({ t: 'toast', text: a.toast }); break;
        case 'grant':
          if (!s.evidence[a.grant]) {
            s.evidence[a.grant] = ++s.order;
            q.push({ t: 'toast', kind: 'gain', text: '📓 증거 등록 · ' + EF.EVIDENCE[a.grant].name });
          }
          break;
        case 'puzzle': q.push({ t: 'puzzle', id: a.puzzle }); break;
        case 'flag': s.flags[a.flag] = true; break;
        case 'deduce':
          if (!s.deduced[a.deduce]) {
            s.deduced[a.deduce] = true;
            const d = EF.DEDUCTIONS.find(x => x.id === a.deduce);
            q.push({ t: 'toast', kind: 'gain', text: '🧩 추리 기록 · ' + d.title });
          }
          break;
        default: console.warn('알 수 없는 액션', key);
      }
    }
    if (blocked) q.push({ t: 'toast', text: EF.TEXT.endedBlocked });
  };

  // 단계가 올랐으면 알림(+엔딩)을 queue 끝에 붙인다
  EF.afterStage = function (before, q) {
    const now = EF.getStage();
    if (now > before) {
      q.push({ t: 'stage', stage: now });
      if (now === 5) q.push({ t: 'ending' });
    }
  };

  // 핫스팟 클릭: 첫 번째로 통과하는 규칙 실행
  EF.click = function (hotspot) {
    const q = [], before = EF.getStage();
    const rule = hotspot.rules.find(r => EF.check(r.if));
    if (rule) EF.exec(rule.do, q);
    EF.afterStage(before, q);
    return q;
  };

  EF.solvePuzzle = function (pid) {
    const q = [], before = EF.getStage(), p = EF.PUZZLES[pid];
    EF.state.solved[pid] = true;
    if (p.success) q.push({ t: 'text', text: p.success });
    EF.exec(p.onSolve || [], q);
    EF.afterStage(before, q);
    return q;
  };

  // 추리 연결: picks 가 requires 와 같은 집합이면 성공
  EF.tryDeduce = function (id, picks) {
    const d = EF.DEDUCTIONS.find(x => x.id === id), q = [];
    if (EF.isEnded()) { q.push({ t: 'toast', text: EF.TEXT.endedBlocked }); return { ok: false, q }; }
    const ok = d.requires.length === picks.length && d.requires.every(r => picks.includes(r));
    if (ok) EF.exec([{ deduce: id }], q);
    return { ok, q };
  };

  EF.finalStatus = function () {
    const mains = EF.DEDUCTIONS.filter(d => d.kind === 'main' && EF.state.deduced[d.id]).length;
    return { mains, stageOk: EF.getStage() >= 4, ready: mains === 3 && EF.getStage() >= 4 };
  };
  EF.tryFinal = function () {
    const q = [];
    if (EF.isEnded()) { q.push({ t: 'toast', text: EF.TEXT.endedBlocked }); return { ok: false, q }; }
    if (!EF.finalStatus().ready) return { ok: false, q };
    EF.exec([{ deduce: 'FINAL-01' }], q);
    return { ok: true, q };
  };

  EF.npcLine = function (npcId) {
    const n = EF.NPCS[npcId];
    const l = (n.lines || []).find(x => EF.check(x.if));
    return l ? l.text : EF.TEXT.npcPlaceholder;
  };
})();

(function () {

    return e;
  };
  EF.h = h;
  const UI = (EF.UI = { busy: false, hints: false, dismiss: null, visited: {}, shown: null, memoFrom: 'WORLD_MAP' });
  let stage, wrap, sceneEl, wm, hsEl, navEl, crumbsEl, ptitle, pintro, tagline, counter, sideEl, nbCount, firstRender = true;

  UI.init = function () {
    EF.SCENES.MEMO = EF.SCENES.MEMO || { id: 'MEMO', name: EF.TEXT.site.memoName, kind: 'memo', hotspots: [], bg: '#eee', intro: EF.TEXT.site.memoIntro };
    stage = UI.stage = $('stage'); wrap = $('stagewrap');
    navEl = $('nav'); crumbsEl = $('crumbs'); ptitle = $('ptitle'); pintro = $('pintro');
    tagline = $('tagline'); counter = $('counter'); sideEl = $('side');
    UI.panelEl = $('panel'); UI.logEl = $('log'); UI.memoEl = $('memo');
    stage.innerHTML = '';
    sceneEl = h('div', 'scene'); wm = h('div', 'wm'); sceneEl.append(wm);
    hsEl = h('div', 'hotspots');
    stage.append(sceneEl, h('div', 'fx'), hsEl);
    EF.Debug.init(stage);

    EF.TEXT.site.nav.forEach(([label, id]) => {
      const a = h('a', 'navitem', label); a.href = '#' + id; a.dataset.scene = id;
      a.onclick = e => { e.preventDefault(); UI.goto(id); };
      navEl.append(a);
    });
    const memo = h('a', 'navitem nav-memo', '📓 메모'); memo.href = '#MEMO'; nbCount = h('b', '', '0');
    memo.append(' (', nbCount, ')');
    memo.onclick = e => { e.preventDefault(); UI.openMemo(); };
    navEl.append(memo);

    $('hintLink').onclick = e => {
      e.preventDefault(); UI.hints = !UI.hints; stage.classList.toggle('hints', UI.hints);
      e.target.textContent = UI.hints ? '클릭할 수 있는 곳 표시 끄기' : '클릭할 수 있는 곳 표시하기';
    };
    if (/[?&]dev\b/.test(location.search)) {
      const d = h('a', 'devlink', 'DEV'); d.href = '#'; d.onclick = e => { e.preventDefault(); EF.Debug.toggle(); };
      $('devSlot').append(d);
    }

    addEventListener('resize', UI.fit);
    addEventListener('keydown', e => {
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'd') { EF.Debug.toggle(); return; }
      if (e.key === 'Escape' && UI.dismiss) { e.preventDefault(); UI.dismiss(); }
    });
    addEventListener('popstate', () => {
      const id = location.hash.slice(1);
      if (!EF.SCENES[id] || !UI.visited[id]) { history.replaceState(null, '', '#' + EF.state.scene); return; }
      if (UI.dismiss) UI.dismiss();
      if (id !== EF.state.scene) { if (EF.state.scene !== 'MEMO' && id === 'MEMO') UI.memoFrom = EF.state.scene; EF.state.scene = id; UI.render(true); }
    });
    UI.render();
    UI.fit();
  };

  UI.fit = function () {
    if (!wrap.clientWidth) return;           // 메모 페이지처럼 그림이 숨겨진 동안은 계산하지 않는다
    const s = wrap.clientWidth / 1280;
    wrap.style.height = Math.round(720 * s) + 'px';
    stage.style.transform = `scale(${s})`;
  };

  UI.goto = function (id) {
    if (!EF.SCENES[id] || id === EF.state.scene) return;
    if (UI.dismiss) UI.dismiss();            // 열려 있는 퍼즐은 닫고 이동
    if (EF.state.scene !== 'MEMO' && id === 'MEMO') UI.memoFrom = EF.state.scene;
    EF.state.scene = id; UI.render();
    scrollTo({ top: 0 });
  };
  UI.openMemo = function () { UI.goto(EF.state.scene === 'MEMO' ? UI.memoFrom : 'MEMO'); };

  UI.activate = function (hp) { if (UI.busy) return; UI.run(EF.click(hp)); };

  UI.render = function (fromHistory) {
    const st = EF.state, sc = EF.SCENES[st.scene], stg = EF.getStage(), memo = sc.kind === 'memo';
    UI.visited[sc.id] = true;
    if (!fromHistory && location.hash !== '#' + sc.id) {
      if (firstRender) history.replaceState(null, '', '#' + sc.id); else history.pushState(null, '', '#' + sc.id);
    }
    firstRender = false;
    document.title = `${sc.name} · EVERFREEZE`;
    stage.dataset.stage = stg; document.body.dataset.stage = stg;

    // 페이지가 바뀌면 기록·패널 비우기
    const changed = UI.shown !== sc.id;
    UI.shown = sc.id;
    if (changed) { UI.logEl.innerHTML = ''; UI.panelEl.innerHTML = ''; }

    // 사이트 틀
    tagline.textContent = EF.TEXT.site.tagline[stg];
    counter.textContent = EF.TEXT.site.counter[stg];
    nbCount.textContent = Object.keys(st.evidence).length;
    [...navEl.querySelectorAll('.navitem')].forEach(a => {
      const on = memo ? a.classList.contains('nav-memo')
        : (a.dataset.scene === sc.id || (sc.village && a.textContent === sc.village));
      a.classList.toggle('on', !!on);
    });
    const parentId = memo ? UI.memoFrom : sc.parent;
    crumbsEl.innerHTML = '';
    if (parentId) {
      const b = h('a', 'back', memo ? '◀ 돌아가기' : '◀ 뒤로'); b.href = '#'; b.onclick = e => { e.preventDefault(); UI.goto(parentId); };
      crumbsEl.append(b, h('span', 'sep', '|'));
    }
    const chain = []; if (!memo) for (let c = sc; c; c = EF.SCENES[c.parent]) chain.unshift(c); else chain.push(sc);
    chain.forEach((c, i) => {
      if (i) crumbsEl.append(h('span', 'sep', '›'));
      if (i < chain.length - 1) {
        const a = h('a', 'crumb', c.name); a.href = '#'; a.onclick = e => { e.preventDefault(); UI.goto(c.id); };
        crumbsEl.append(a);
      } else crumbsEl.append(h('span', 'crumb now', c.name));
    });
    ptitle.textContent = sc.name;
    pintro.textContent = sc.intro || (sc.kind === 'world' ? EF.TEXT.site.worldIntro : EF.TEXT.site.mapIntro);

    $('cols').style.display = memo ? 'none' : '';
    $('tip').style.display = memo ? 'none' : '';
    UI.memoEl.style.display = memo ? '' : 'none';
    if (memo) { if (changed) UI.mountNotebook(UI.memoEl); return; }

    // 그림 + 핫스팟
    const img = EF.BG_IMAGES.includes(sc.id) ? `url(assets/bg/${sc.id}.png) center/cover no-repeat, ` : '';
    sceneEl.style.background = img + sc.bg;
    wm.textContent = sc.name;
    UI.fit();                                 // 숨겨졌다 돌아온 경우에도 크기를 다시 맞춘다
    hsEl.innerHTML = ''; sideEl.innerHTML = '';
    sideEl.append(h('h3', '', EF.TEXT.site.sideTitle));
    const groups = { move: [], npc: [], inspect: [], puzzle: [] };
    sc.hotspots.forEach(hp => {
      if (!EF.check(hp.showIf)) return;
      const b = h('button', `hs hs-${hp.kind}` + (hp.temp ? ' temp' : ''));
      b.style.cssText = `left:${hp.x}px;top:${hp.y}px;width:${hp.w}px;height:${hp.h}px`;
      b.dataset.id = hp.id;
      b.append(h('span', 'ico', hp.icon), h('span', 'lbl', hp.label));
      b.onclick = () => UI.activate(hp);
      hsEl.append(b);
      const a = h('a', 'lk lk-' + hp.kind, `${hp.icon} ${hp.label}`); a.href = '#'; a.dataset.id = hp.id;
      a.onclick = e => { e.preventDefault(); UI.activate(hp); };
      groups[hp.kind].push(a);
    });
    Object.keys(groups).forEach(k => {
      if (!groups[k].length) return;
      const g = h('div', 'sgroup'); g.append(h('div', 'sg-title', EF.TEXT.site.sideGroups[k]));
      groups[k].forEach(a => g.append(a)); sideEl.append(g);
    });
  };
})();

</script>
<script>
/* 본문 기록(조사·대화·알림) · 퍼즐 · 엔딩 · 큐 처리. 팝업 없이 모두 페이지 안에 글로 쌓인다. */
(function () {
  const EF = window.EF, UI = EF.UI, h = EF.h;

  function entry(cls) {
    const e = h('div', 'entry ' + cls);
    UI.logEl.append(e);
    setTimeout(() => e.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 30);
    return e;
  }

  UI.showText = function (it) {
    const e = entry('text');
    if (it.who) e.append(h('div', 'who', it.who));
    e.append(h('div', 'body', it.text));
    if (it.note) e.append(h('div', 'note', '✔ ' + it.note));
  };

  UI.showSay = function (it) {
    const n = EF.NPCS[it.npc], e = entry('say');
    const por = h('div', 'portrait', n.name[0]); por.style.background = n.color;
    const col = h('div', 'dcol'), head = h('div', 'dhead');
    head.append(h('b', '', n.name), h('span', 'role', n.role));
    if (it.ctx) head.append(h('span', 'ctx', it.ctx));
    col.append(head, h('div', 'body', EF.npcLine(it.npc)));
    e.append(por, col);
  };

  UI.toast = function (text, kind) { entry('line' + (kind ? ' ' + kind : '')).textContent = text; };
  UI.banner = function () { entry('stagenote').textContent = '… ' + EF.TEXT.site.stageNotice; };

  UI.showEnding = function () {
    UI.panelEl.innerHTML = '';
    const card = h('div', 'ending');
    card.append(h('h2', '', EF.TEXT.ending.title));
    EF.TEXT.ending.body.split('\n').forEach(l => card.append(h('p', '', l || ' ')));
    const b = h('button', 'btn primary', EF.TEXT.ending.btn);
    b.onclick = () => { UI.panelEl.innerHTML = ''; };
    card.append(b); UI.panelEl.append(card);
    setTimeout(() => card.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 30);
  };

  // ---------- 퍼즐 (페이지 안 패널) ----------
  UI.showPuzzle = function (pid, done) {
    const p = EF.PUZZLES[pid];
    UI.busy = true;
    UI.panelEl.innerHTML = '';
    const card = h('div', 'puzzle');
    card.append(h('h3', '', p.title), h('p', 'prompt', p.prompt));
    const msg = h('div', 'pmsg', ''), area = h('div', 'parea'), actions = h('div', 'pactions');
    const okBtn = h('button', 'btn primary', '확인'); okBtn.disabled = true;
    const cancel = h('button', 'btn', '닫기');
    actions.append(cancel, okBtn);
    card.append(area, msg, actions); UI.panelEl.append(card);
    setTimeout(() => card.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 30);

    let ok = () => false;
    const fail = () => { msg.textContent = p.fail; card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); };

    if (p.type === 'pick') {
      let sel = -1;
      p.options.forEach((o, i) => {
        const b = h('button', 'opt', o);
        b.onclick = () => { sel = i; [...area.children].forEach((c, j) => c.classList.toggle('on', j === i)); okBtn.disabled = false; msg.textContent = ''; };
        area.append(b);
      });
      ok = () => sel === p.answer;
    } else if (p.type === 'order') {
      let seq = [];
      const seqEl = h('div', 'seq'), pool = h('div', 'pool');
      const draw = () => {
        seqEl.innerHTML = ''; pool.innerHTML = '';
        p.items.forEach((_, i) => {
          const slot = h('div', 'slot', seq[i] !== undefined ? p.items[seq[i]] : String(i + 1));
          if (seq[i] !== undefined) slot.classList.add('filled');
          seqEl.append(slot);
        });
        p.shuffle.forEach(idx => {
          const b = h('button', 'opt', p.items[idx]); b.disabled = seq.includes(idx);
          b.onclick = () => { seq.push(idx); msg.textContent = ''; draw(); };
          pool.append(b);
        });
        const reset = h('button', 'btn small', '처음부터'); reset.onclick = () => { seq = []; msg.textContent = ''; draw(); };
        pool.append(reset);
        okBtn.disabled = seq.length !== p.items.length;
      };
      area.append(seqEl, pool); draw();
      ok = () => seq.every((v, i) => v === i);
    } else if (p.type === 'code') {
      const inp = h('input', 'code'); inp.maxLength = p.digits || 4; inp.inputMode = 'numeric'; inp.placeholder = '숫자 입력';
      inp.oninput = () => { inp.value = inp.value.replace(/\D/g, ''); okBtn.disabled = !inp.value; msg.textContent = ''; };
      inp.onkeydown = e => { if (e.key === 'Enter' && !okBtn.disabled) okBtn.click(); };
      area.append(inp); setTimeout(() => inp.focus({ preventScroll: true }), 30);
      ok = () => inp.value === p.answer;
    }

    const close = solved => {
      UI.panelEl.innerHTML = ''; UI.dismiss = null; UI.busy = false;
      done(solved ? EF.solvePuzzle(pid) : []);
    };
    okBtn.onclick = () => { if (ok()) close(true); else fail(); };
    cancel.onclick = () => close(false);
    UI.dismiss = () => close(false);
  };

  // ---------- 큐 처리 ----------
  UI.run = function (queue) {
    UI.render();
    const next = () => {
      for (;;) {
        const it = queue.shift();
        if (!it) { UI.render(); return; }
        switch (it.t) {
          case 'toast': UI.toast(it.text, it.kind); break;
          case 'text': UI.showText(it); break;
          case 'say': UI.showSay(it); break;
          case 'stage': UI.render(); UI.banner(); break;
          case 'ending': UI.render(); UI.showEnding(); break;
          case 'puzzle': UI.showPuzzle(it.id, q => { queue.unshift(...q); next(); }); return;
        }
        UI.render();
      }
    };
    next();
  };
})();

</script>
<script>
/* 추리 메모(NOTEBOOK) 페이지: 증거 목록 + 필수/선택 추리. 슬롯에 증거를 채워 "연결"하면 가설이 기록된다. */
(function () {
  const EF = window.EF, UI = EF.UI, h = EF.h;

  UI.mountNotebook = function (root) {
    let active = null, picks = [], detail = null, message = '';

    function draw() {
      root.innerHTML = '';
      const panel = h('div', 'notebook');
      const cols = h('div', 'nb-cols');
      cols.append(drawEvidence(), drawDeductions());
      panel.append(cols); root.append(panel);
    }

    function drawEvidence() {
      const left = h('div', 'nb-left');
      [['trace', '리셋 흔적'], ['clue', '단서'], ['opt', '선택 단서']].forEach(([type, title]) => {
        const own = Object.keys(EF.state.evidence).filter(id => EF.EVIDENCE[id].type === type)
          .sort((a, b) => EF.state.evidence[a] - EF.state.evidence[b]);
        left.append(h('h4', '', `${title} (${own.length})`));
        const list = h('div', 'evlist');
        if (!own.length) list.append(h('div', 'empty', '아직 없음'));
        own.forEach(id => {
          const e = EF.EVIDENCE[id];
          const b = h('button', 'ev' + (picks.includes(id) ? ' picked' : ''), `${id} · ${e.name}`);
          b.onclick = () => {
            detail = id; message = '';
            if (active && picks.length < active.requires.length && !picks.includes(id)) picks.push(id);
            draw();
          };
          list.append(b);
        });
        left.append(list);
      });
      const d = h('div', 'evdetail');
      if (detail) {
        const e = EF.EVIDENCE[detail];
        d.append(h('b', '', `${detail} · ${e.name}`), h('span', 'place', e.place), h('p', '', e.desc));
      } else d.append(h('p', 'empty', '증거를 누르면 설명이 보입니다. 오른쪽에서 추리를 고른 뒤 증거를 누르면 슬롯에 채워집니다.'));
      left.append(d);
      return left;
    }

    function drawDeductions() {
      const right = h('div', 'nb-right');
      [['main', '필수 추리'], ['final', '통합 추리'], ['opt', '선택 추리 (엔딩 조건과 무관)']].forEach(([kind, title]) => {
        right.append(h('h4', '', title));
        EF.DEDUCTIONS.filter(d => d.kind === kind).forEach(d => right.append(card(d)));
      });
      return right;
    }

    function card(d) {
      const solved = !!EF.state.deduced[d.id];
      const c = h('div', 'dcard' + (solved ? ' solved' : '') + (active === d ? ' active' : ''));
      const top = h('div', 'dtop');
      top.append(h('b', '', `${d.id} ${d.title}`), h('span', 'tag', solved ? '완료' : '미완료'));
      c.append(top);
      if (solved) {
        c.append(h('p', 'hypo', '가설: ' + d.hypo));
        if (d.kind === 'final') c.append(h('p', 'sub', '(임시 안내) 아리아가 있는 도서관을 찾아가 보자.'));
        return c;
      }
      if (d.kind === 'final') {
        const st = EF.finalStatus();
        c.append(h('p', 'sub', `필수 추리 ${st.mains}/3 완료 · ${st.stageOk ? '조건 충족 ✔' : '아직 조건이 부족하다'}`));
        const b = h('button', 'btn primary small', '통합 추리 기록'); b.disabled = !st.ready;
        b.onclick = () => { const r = EF.tryFinal(); r.q.forEach(i => i.t === 'toast' && UI.toast(i.text, i.kind)); draw(); };
        c.append(b); return c;
      }
      if (active !== d) {
        c.append(h('p', 'sub', `연결할 증거 ${d.requires.length}개`));
        const b = h('button', 'btn small', '이 추리에 증거 연결'); b.onclick = () => { active = d; picks = []; message = ''; draw(); };
        c.append(b); return c;
      }
      const slots = h('div', 'slots');
      for (let i = 0; i < d.requires.length; i++) {
        const id = picks[i];
        const s = h('button', 'slot' + (id ? ' filled' : ''), id ? `${id} · ${EF.EVIDENCE[id].name}` : '비어 있음');
        s.onclick = () => { if (id) { picks.splice(i, 1); draw(); } };
        slots.append(s);
      }
      c.append(slots);
      if (message) c.append(h('p', 'msg', message));
      const row = h('div', 'row');
      const link = h('button', 'btn primary small', '연결하기'); link.disabled = picks.length !== d.requires.length;
      link.onclick = () => {
        const r = EF.tryDeduce(d.id, picks);
        r.q.forEach(i => i.t === 'toast' && UI.toast(i.text, i.kind));
        if (r.ok) { active = null; picks = []; message = ''; } else { message = '서로 이어지지 않는다. 다른 증거를 골라 보자.'; picks = []; }
        draw();
      };
      const cancel = h('button', 'btn small', '취소'); cancel.onclick = () => { active = null; picks = []; message = ''; draw(); };
      row.append(link, cancel); c.append(row);
      return c;
    }
    draw();
  };
})();

</script>
<script>
/* 개발용 패널(DEV 버튼). 장면 이동 · 증거 지급 · 상태 확인 · 초기화. 최종 배포 때는 버튼만 숨기면 된다. */
(function () {
  const EF = window.EF, h = EF.h;
  let panel;
  EF.Debug = {
    init(stage) {
      panel = h('div', 'devpanel'); panel.style.display = 'none'; stage.append(panel);
    },
    toggle() {
      panel.style.display = panel.style.display === 'none' ? '' : 'none';
      if (panel.style.display === '') this.draw();
    },
    draw() {
      panel.innerHTML = '';
      const st = EF.state;
      panel.append(h('b', '', `DEV · 단계 ${EF.getStage()} · 흔적 ${EF.traceCount()}/13`));
      const sel = h('select'); Object.values(EF.SCENES).forEach(s => { const o = h('option', '', `${s.id} ${s.name}`); o.value = s.id; if (s.id === st.scene) o.selected = true; sel.append(o); });
      sel.onchange = () => { st.scene = sel.value; EF.UI.render(); };
      panel.append(sel);
      const ev = h('div', 'devev');
      Object.keys(EF.EVIDENCE).forEach(id => {
        const b = h('button', st.evidence[id] ? 'on' : '', id);
        b.title = EF.EVIDENCE[id].name;
        b.onclick = () => { if (st.evidence[id]) delete st.evidence[id]; else st.evidence[id] = ++st.order; EF.UI.render(); this.draw(); };
        ev.append(b);
      });
      panel.append(ev);
      const flags = h('div', 'devflags', 'flags: ' + (Object.keys(st.flags).join(', ') || '-') + ' | 퍼즐: ' + (Object.keys(st.solved).join(', ') || '-') + ' | 추리: ' + (Object.keys(st.deduced).join(', ') || '-'));
      panel.append(flags);
      const row = h('div', 'row');
      const reset = h('button', '', '전체 초기화'); reset.onclick = () => { EF.reset(); EF.UI.shown = null; EF.UI.render(); this.draw(); };
      const close = h('button', '', '닫기'); close.onclick = () => this.toggle();
      row.append(reset, close); panel.append(row);
    }
  };
})();

</script>
<script>
/* 시작: 타이틀 없이 월드맵에서 바로 시작. */
document.addEventListener('DOMContentLoaded', () => window.EF.UI.init());

</script>
